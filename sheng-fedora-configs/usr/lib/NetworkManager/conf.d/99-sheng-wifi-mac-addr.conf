# NetworkManager >= 1.56 ships 22-wifi-mac-addr.conf defaulting Wi-Fi to a
# generated stable-ssid MAC. Override it: the kernel restores the factory
# address from persist (see sheng-wlan.service), and that is what should go
# on air.
[connection.99-sheng-wifi-mac-addr]
match-device=type:wifi
wifi.cloned-mac-address=permanent

[.config]
enable=nm-version-min:1.45
